<script>
    document.addEventListener('DOMContentLoaded', () => {
        const menubtn = document.getElementById('barmenu');
        const menucntn = document.querySelector('.barmenu');
        menubtn.addEventListener('click', () => {
            menucntn.classList.toggle('active');
        })
        document.addEventListener('click', (event) => {
            if (!menubtn.contains(event.target) && !menucntn.contains(event.target)) {
                menucntn.classList.remove('active');
            }
        })
    })
</script>
